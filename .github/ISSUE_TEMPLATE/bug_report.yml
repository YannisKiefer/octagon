name: Bug report
description: Something does not work the way the docs say it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Before you submit: redact any private data from logs and screenshots. Events stored in `infra/db/farm.db` are user content, so do not paste them unredacted.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Exact commands and clicks, starting from a fresh state if possible.
      placeholder: |
        1. Run '...'
        2. Open '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened, including any error text.
    validations:
      required: true
  - type: input
    id: macos-version
    attributes:
      label: macOS version
      description: "From the Apple menu: About This Mac."
      placeholder: "e.g. 15.6"
    validations:
      required: true
  - type: input
    id: node-version
    attributes:
      label: Node version
      description: Output of `node -v`.
      placeholder: "e.g. v20.11.1"
    validations:
      required: true
  - type: dropdown
    id: voice-control
    attributes:
      label: Is Voice Control enabled on the iPhone?
      options:
        - "Yes"
        - "No"
        - "Not applicable"
    validations:
      required: true
  - type: dropdown
    id: dry-run
    attributes:
      label: Does the dry run work?
      description: "Run `node infra/farm/farm-brain.js --slot=1 --prefix=Alpha --dry-run --log` and say whether it completes without errors."
      options:
        - "Yes"
        - "No"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Paste console output or drag log files into this field. Warning: redact any private data first. Events in `infra/db/farm.db` are user content and must not be attached unredacted.
    validations:
      required: false
