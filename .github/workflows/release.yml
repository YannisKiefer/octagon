# Release: verify the tagged commit (farm + dashboard) then publish a GitHub Release.
name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Verify tag and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            infra/farm/package-lock.json
            apps/dashboard/package-lock.json

      - name: Install farm dependencies
        working-directory: infra/farm
        run: npm ci

      - name: Syntax-check hub, brain, MCP server and demo seeder
        run: |
          node --check infra/farm/hub.js
          node --check infra/farm/farm-brain.js
          node --check mcp/server.js
          node --check scripts/seed-demo.js

      - name: Seed synthetic demo data into a temp database
        env:
          FARM_DB_PATH: ${{ runner.temp }}/farm.db
        run: |
          set -eo pipefail
          node scripts/seed-demo.js | tee "$RUNNER_TEMP/seed.log"
          grep -q "Seeded demo data" "$RUNNER_TEMP/seed.log"

      - name: Run bounded silent hub dry run (stops after 30s)
        run: |
          code=0
          timeout 30 env FARM_DB_PATH="$RUNNER_TEMP/farm.db" \
            node infra/farm/hub.js --slots=1 --duration=0.05 --test \
            > "$RUNNER_TEMP/hub-dry.log" 2>&1 || code=$?
          echo "hub dry-run exit code: $code (0 or 124 expected)"
          if [ "$code" -ne 0 ] && [ "$code" -ne 124 ]; then
            cat "$RUNNER_TEMP/hub-dry.log"
            exit "$code"
          fi
          grep -q "OCTAGON HUB" "$RUNNER_TEMP/hub-dry.log"

      - name: Run test suite against a freshly seeded default database
        run: |
          node scripts/seed-demo.js
          node tests/test_octagon.mjs

      - name: Install dashboard dependencies
        working-directory: apps/dashboard
        run: npm ci

      - name: Build the dashboard
        working-directory: apps/dashboard
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: npm run build

      - name: Create GitHub release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Octagon ${GITHUB_REF_NAME}" \
            --notes "See CHANGELOG.md for what changed. Octagon is run from source; see the README quick start." \
            --generate-notes
