<!doctype html><html><body><canvas id="c" width="1231" height="1231"></canvas><pre id="out"></pre>
<script>
const img = new Image();
img.onload = () => {
  const c = document.getElementById('c'), x = c.getContext('2d', {willReadFrequently:true});
  c.width = img.width; c.height = img.height;
  x.drawImage(img, 0, 0);
  const d = x.getImageData(0,0,c.width,c.height).data;
  const W = c.width, H = c.height;
  const isDark = (r,g,b) => g > r + 10 && g < 130 && b > r - 10 && b < g + 10; // forest green
  const isBronze = (r,g,b) => r > 140 && r - b > 45 && g - b > 20 && r > g; // warm bronze only
  const at = (px,py) => { const i = (py*W+px)*4; return [d[i],d[i+1],d[i+2]]; };
  // bounding boxes
  let minX=1e9,maxX=-1,minY=1e9,maxY=-1, bronze={minX:1e9,maxX:-1,minY:1e9,maxY:-1};
  for (let py=0; py<H; py+=1) for (let px=0; px<W; px+=1) {
    const [r,g,b] = at(px,py);
    if (isDark(r,g,b) || isBronze(r,g,b)) { if(px<minX)minX=px; if(px>maxX)maxX=px; if(py<minY)minY=py; if(py>maxY)maxY=py; }
    if (isBronze(r,g,b)) { if(px<bronze.minX)bronze.minX=px; if(px>bronze.maxX)bronze.maxX=px; if(py<bronze.minY)bronze.minY=py; if(py>bronze.maxY)bronze.maxY=py; }
  }
  const out = [];
  out.push(`overall bbox x:${minX}-${maxX} y:${minY}-${maxY} (w ${maxX-minX}, h ${maxY-minY})`);
  out.push(`bronze bbox x:${bronze.minX}-${bronze.maxX} y:${bronze.minY}-${bronze.maxY}`);
  // horizontal scan through center: band edges
  const cy = Math.round((minY+maxY)/2);
  let runs=[], inBand=false, start=0;
  for (let px=0; px<W; px++) {
    const [r,g,b] = at(px,cy);
    const band = isDark(r,g,b);
    if (band && !inBand) { inBand=true; start=px; }
    if (!band && inBand) { inBand=false; runs.push([start,px-1]); }
  }
  out.push(`dark runs at y=${cy}: ${JSON.stringify(runs)}`);
  // vertical scan through center
  const cx = Math.round((minX+maxX)/2);
  runs=[]; inBand=false;
  for (let py=0; py<H; py++) {
    const [r,g,b] = at(cx,py);
    const band = isDark(r,g,b);
    if (band && !inBand) { inBand=true; start=py; }
    if (!band && inBand) { inBand=false; runs.push([start,py-1]); }
  }
  out.push(`dark runs at x=${cx}: ${JSON.stringify(runs)}`);
  // scan upper area for gap/bar: horizontal line at 20% height
  for (const frac of [0.25, 0.3, 0.35]) {
    const sy = Math.round(minY + (maxY-minY)*frac);
    runs=[]; inBand=false;
    for (let px=0; px<W; px++) {
      const [r,g,b] = at(px,sy);
      const band = isDark(r,g,b) || isBronze(r,g,b);
      if (band && !inBand) { inBand=true; start=px; }
      if (!band && inBand) { inBand=false; runs.push([start,px-1]); }
    }
    out.push(`any-shape runs at y=${sy} (${frac}): ${JSON.stringify(runs)}`);
  }
  // sample some colors
  out.push(`color at ring left: ${JSON.stringify(at(Math.round(minX+30), cy))}`);
  out.push(`bronze sample: ${JSON.stringify(at(Math.round((bronze.minX+bronze.maxX)/2), Math.round((bronze.minY+bronze.maxY)/2)))}`);
  document.getElementById('out').textContent = out.join('\n');
};
img.src = 'logo-reference.png';
</script></body></html>
<script>
// detailed gap/bar analysis appended
window.addEventListener('load', () => {
  setTimeout(() => {
    const c = document.getElementById('c'), x = c.getContext('2d', {willReadFrequently:true});
    const d = x.getImageData(0,0,c.width,c.height).data;
    const W = c.width;
    const at = (px,py) => { const i = (py*W+px)*4; return [d[i],d[i+1],d[i+2]]; };
    const isDark = (r,g,b) => g > r + 10 && g < 130 && b > r - 10 && b < g + 10;
    const isBronze = (r,g,b) => r > 140 && r - b > 45 && g - b > 20 && r > g;
    const out2 = [];
    // bar extreme points
    let top=null, bot=null, left=null, right=null;
    for (let py=0; py<c.height; py++) for (let px=0; px<W; px++) {
      const [r,g,b] = at(px,py);
      if (isBronze(r,g,b)) {
        if (top===null || py<top[1]) top=[px,py];
        if (bot===null || py>bot[1]) bot=[px,py];
        if (left===null || px<left[0]) left=[px,py];
        if (right===null || px>right[0]) right=[px,py];
      }
    }
    out2.push(`bar extremes top:${top} bottom:${bot} left:${left} right:${right}`);
    // ring presence along the top-right: for angles 20..80 deg, is band dark present between r=250..340 from center (627,619)?
    const cx=627, cy=619;
    const missing=[];
    for (let a=15; a<=80; a+=5) {
      const rad=a*Math.PI/180;
      let found=false;
      for (let r=240; r<350; r++) {
        const px=Math.round(cx+r*Math.cos(rad)), py=Math.round(cy-r*Math.sin(rad));
        const [R,G,B]=at(px,py);
        if (isDark(R,G,B)) { found=true; break; }
      }
      if (!found) missing.push(a);
    }
    out2.push(`angles with no dark band (deg): ${missing.join(',')}`);
    // where do the band ends cut? scan rows between y=280 and y=500 for the rightmost dark pixel
    const ends=[];
    for (let py=280; py<=520; py+=20) {
      let rx=-1;
      for (let px=980; px>600; px--) { const [r,g,b]=at(px,py); if (isDark(r,g,b)) { rx=px; break; } }
      ends.push(`${py}:${rx}`);
    }
    out2.push(`rightmost dark pixel per row: ${ends.join(' ')}`);
    const el=document.getElementById('out');
    el.textContent = el.textContent + '\n' + out2.join('\n');
  }, 300);
});
</script>
