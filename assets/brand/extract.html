<!doctype html><html><body><canvas id="w" width="700" height="700"></canvas>
<script>
const img = new Image();
img.onload = () => {
  const src = document.createElement('canvas');
  src.width = img.width; src.height = img.height;
  const sx = src.getContext('2d', {willReadFrequently:true});
  sx.drawImage(img, 0, 0);
  const d = sx.getImageData(0,0,src.width,src.height);
  const px = d.data;
  // content bbox (non-ivory)
  let minX=1e9,maxX=-1,minY=1e9,maxY=-1;
  const isBg = (r,g,b,a) => a < 10 || (r>235 && g>233 && b>225);
  for (let y=0; y<src.height; y++) for (let x=0; x<src.width; x++) {
    const i=(y*src.width+x)*4;
    if (!isBg(px[i],px[i+1],px[i+2],px[i+3])) {
      if(x<minX)minX=x; if(x>maxX)maxX=x; if(y<minY)minY=y; if(y>maxY)maxY=y;
    }
  }
  const pad = 6;
  minX-=pad; minY-=pad; maxX+=pad; maxY+=pad;
  const w = maxX-minX+1, h = maxY-minY+1;
  // cut transparent full-color
  const c1 = document.createElement('canvas'); c1.width=w; c1.height=h;
  const x1 = c1.getContext('2d');
  const d1 = x1.createImageData(w,h);
  // reversed (band -> ivory) and app icon (forest square + reversed)
  for (let y=0; y<h; y++) for (let x=0; x<w; x++) {
    const si = ((y+minY)*src.width + (x+minX))*4;
    const di = (y*w+x)*4;
    let r=px[si], g=px[si+1], b=px[si+2];
    let a = isBg(r,g,b,px[si+3]) ? 0 : 255;
    d1.data[di]=r; d1.data[di+1]=g; d1.data[di+2]=b; d1.data[di+3]=a;
  }
  x1.putImageData(d1,0,0);
  document.getElementById('w').width = w; document.getElementById('w').height = h;
  document.getElementById('w').getContext('2d').drawImage(c1,0,0);
  window.__result = { w, h, toDataURL: () => c1.toDataURL('image/png') };
  window.dispatchEvent(new Event('ready'));
};
img.src = 'logo-reference.png';
</script></body></html>
