<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Octagon - one conversation, many agents, many phones">
  <rect width="1200" height="300" fill="#F8F6F1"/>
  <rect x="0.5" y="0.5" width="1199" height="299" fill="none" stroke="#0F1F17" stroke-opacity="0.16"/>

  <!-- wordmark panel -->
  <g>
    <!-- master mark: assets/brand/octagon-mark.svg (geometry unchanged) -->
    <svg x="72" y="90" width="120" height="120" viewBox="0 0 240 240">
      <defs>
        <linearGradient id="bronzeBanner" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#D9A76F"/>
          <stop offset="1" stop-color="#B07A42"/>
        </linearGradient>
      </defs>
      <path d="M 163.94 33.28 L 158.27 27.61 L 81.73 27.61 L 27.61 81.73 L 27.61 158.27 L 81.73 212.39 L 158.27 212.39 L 212.39 158.27 L 212.39 81.73 L 206.72 75.99"
            fill="none" stroke="#1F3A2E" stroke-width="40"
            stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10"/>
      <polygon points="237.6,58.0 205.0,90.6 148.4,34.0 181.0,1.4" fill="url(#bronzeBanner)"/>
    </svg>
    <text x="220" y="147" font-family="'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif"
          font-size="54" font-weight="700" fill="#0F1F17" letter-spacing="-0.5">Octagon</text>
    <text x="222" y="188" font-family="'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif"
          font-size="21" fill="#4A5A50">Your iPhone fleet, on your Mac.</text>
  </g>

  <!-- conversation -> agents -> phones -->
  <g font-family="'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="15" fill="#4A5A50">
    <rect x="560" y="86" width="168" height="128" rx="12" fill="#FFFFFF" stroke="#0F1F17" stroke-opacity="0.2"/>
    <rect x="576" y="102" width="104" height="12" rx="6" fill="#EDE8DC"/>
    <rect x="608" y="122" width="104" height="12" rx="6" fill="#E3DDD0"/>
    <rect x="576" y="142" width="76" height="12" rx="6" fill="#EDE8DC"/>
    <circle cx="584" cy="192" r="5" fill="#C58E5B"/>
    <text x="596" y="197" fill="#8F6234" font-size="12">run 20</text>
    <text x="644" y="62" text-anchor="middle" fill="#0F1F17" font-size="14" font-weight="700">one conversation</text>

    <rect x="800" y="86" width="132" height="128" rx="12" fill="#FFFFFF" stroke="#0F1F17" stroke-opacity="0.2"/>
    <g fill="none" stroke="#4A5A50" stroke-width="2.5">
      <polygon points="866,104 878,116 866,128 854,116"/>
      <polygon points="830,150 842,162 830,174 818,162"/>
      <polygon points="902,150 914,162 902,174 890,162"/>
    </g>
    <line x1="866" y1="128" x2="834" y2="150" stroke="#7A877D" stroke-width="2"/>
    <line x1="866" y1="128" x2="898" y2="150" stroke="#7A877D" stroke-width="2"/>
    <text x="866" y="62" text-anchor="middle" fill="#0F1F17" font-size="14" font-weight="700">many agents</text>

    <rect x="1004" y="86" width="132" height="128" rx="12" fill="#FFFFFF" stroke="#0F1F17" stroke-opacity="0.2"/>
    <g fill="none" stroke="#4A5A50" stroke-width="2.5">
      <rect x="1022" y="104" width="26" height="46" rx="6"/>
      <rect x="1057" y="104" width="26" height="46" rx="6"/>
      <rect x="1092" y="104" width="26" height="46" rx="6"/>
    </g>
    <g fill="#C58E5B">
      <circle cx="1035" cy="168" r="4"/>
      <circle cx="1070" cy="168" r="4"/>
      <circle cx="1105" cy="168" r="4"/>
    </g>
    <text x="1070" y="62" text-anchor="middle" fill="#0F1F17" font-size="14" font-weight="700">many phones</text>

    <g stroke="#7A877D" stroke-width="2" fill="none">
      <line x1="728" y1="150" x2="792" y2="150"/>
      <line x1="932" y1="150" x2="996" y2="150"/>
    </g>
    <g fill="#7A877D">
      <polygon points="792,150 782,145 782,155"/>
      <polygon points="996,150 986,145 986,155"/>
    </g>
  </g>
</svg>
