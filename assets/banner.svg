<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Octagon - one conversation, many agents, many phones">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141416"/>
      <stop offset="1" stop-color="#0d0d0f"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" fill="#0d0d0f"/>
  <rect x="0.5" y="0.5" width="1199" height="299" fill="none" stroke="#1c1c1e"/>

  <!-- wordmark panel -->
  <g>
    <g transform="translate(96,150)">
      <polygon points="-52,-18 -18,-52 18,-52 52,-18 52,18 18,52 -18,52 -52,18"
               fill="none" stroke="#30d158" stroke-width="5"/>
      <circle cx="0" cy="0" r="9" fill="#30d158"/>
      <line x1="0" y1="-9" x2="0" y2="-30" stroke="#30d158" stroke-width="4" stroke-linecap="round"/>
    </g>
    <text x="176" y="141" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif"
          font-size="54" font-weight="700" fill="#f5f5f7" letter-spacing="0.5">Octagon</text>
    <text x="178" y="182" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif"
          font-size="21" fill="#98989d">Your iPhone fleet, on your Mac.</text>
  </g>

  <!-- conversation -> agents -> phones -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif" font-size="15" fill="#98989d">
    <rect x="560" y="86" width="168" height="128" rx="12" fill="url(#panel)" stroke="#2c2c2e"/>
    <rect x="576" y="102" width="104" height="12" rx="6" fill="#26262a"/>
    <rect x="608" y="122" width="104" height="12" rx="6" fill="#323236"/>
    <rect x="576" y="142" width="76" height="12" rx="6" fill="#26262a"/>
    <circle cx="584" cy="192" r="5" fill="#30d158"/>
    <text x="596" y="197" fill="#636366" font-size="12">run 20</text>
    <text x="644" y="62" text-anchor="middle" fill="#f5f5f7" font-size="14" font-weight="600">one conversation</text>

    <rect x="800" y="86" width="132" height="128" rx="12" fill="url(#panel)" stroke="#2c2c2e"/>
    <g fill="none" stroke="#98989d" stroke-width="2.5">
      <polygon points="866,104 878,116 866,128 854,116"/>
      <polygon points="830,150 842,162 830,174 818,162"/>
      <polygon points="902,150 914,162 902,174 890,162"/>
    </g>
    <line x1="866" y1="128" x2="834" y2="150" stroke="#3a3a3c" stroke-width="2"/>
    <line x1="866" y1="128" x2="898" y2="150" stroke="#3a3a3c" stroke-width="2"/>
    <text x="866" y="62" text-anchor="middle" fill="#f5f5f7" font-size="14" font-weight="600">many agents</text>

    <rect x="1004" y="86" width="132" height="128" rx="12" fill="url(#panel)" stroke="#2c2c2e"/>
    <g fill="none" stroke="#98989d" stroke-width="2.5">
      <rect x="1022" y="104" width="26" height="46" rx="6"/>
      <rect x="1057" y="104" width="26" height="46" rx="6"/>
      <rect x="1092" y="104" width="26" height="46" rx="6"/>
    </g>
    <g fill="#30d158">
      <circle cx="1035" cy="168" r="4"/>
      <circle cx="1070" cy="168" r="4"/>
      <circle cx="1105" cy="168" r="4"/>
    </g>
    <text x="1070" y="62" text-anchor="middle" fill="#f5f5f7" font-size="14" font-weight="600">many phones</text>

    <g stroke="#3a3a3c" stroke-width="2" fill="none">
      <line x1="728" y1="150" x2="792" y2="150"/>
      <line x1="932" y1="150" x2="996" y2="150"/>
    </g>
    <g fill="#3a3a3c">
      <polygon points="792,150 782,145 782,155"/>
      <polygon points="996,150 986,145 986,155"/>
    </g>
  </g>
</svg>
