<svg width="1200" height="400" viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0f1e"/>
      <stop offset="100%" stop-color="#0f1e3a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0058bc"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="400" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="400" rx="16" fill="url(#grid)"/>
  <!-- top glow -->
  <circle cx="900" cy="40" r="220" fill="url(#accent)" opacity="0.12"/>
  <circle cx="180" cy="340" r="160" fill="url(#accent)" opacity="0.08"/>
  <!-- phone grid icon -->
  <g transform="translate(560,90)">
    <!-- 4 phones -->
    <rect x="-12" y="0" width="44" height="82" rx="8" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>
    <rect x="38" y="0" width="44" height="82" rx="8" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>
    <rect x="-12" y="92" width="44" height="82" rx="8" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>
    <rect x="38" y="92" width="44" height="82" rx="8" fill="white" opacity="0.95"/>
    <!-- notch -->
    <rect x="-2" y="6" width="24" height="4" rx="2" fill="white" opacity="0.9"/>
    <rect x="48" y="6" width="24" height="4" rx="2" fill="white" opacity="0.9"/>
    <rect x="-2" y="98" width="24" height="4" rx="2" fill="white" opacity="0.9"/>
    <rect x="48" y="98" width="24" height="4" rx="2" fill="#0058bc"/>
    <!-- active dot -->
    <circle cx="60" cy="46" r="6" fill="#0058bc"/>
    <circle cx="60" cy="46" r="10" fill="#0058bc" opacity="0.18"/>
    <!-- sync lines -->
    <path d="M 10 50 L 38 44" stroke="white" stroke-width="1.2" opacity="0.5" stroke-dasharray="3 3"/>
    <path d="M 10 140 L 38 134" stroke="white" stroke-width="1.2" opacity="0.5" stroke-dasharray="3 3"/>
  </g>
  <!-- badge -->
  <g transform="translate(600,46)">
    <rect x="-88" y="-14" width="176" height="28" rx="14" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.12)"/>
    <circle cx="-70" cy="0" r="5" fill="#22c55e"/>
    <text x="-58" y="5" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" letter-spacing="1.4" fill="rgba(255,255,255,0.85)">4 NODES · VOICE CONTROL · LIVE</text>
  </g>
  <!-- title -->
  <text x="600" y="215" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="54" font-weight="800" letter-spacing="-1.8" fill="white">Phone Farm OS</text>
  <text x="600" y="246" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="500" letter-spacing="0.2" fill="rgba(255,255,255,0.72)">Open-source iOS Voice Control farm — Hub-Provider orchestration, parity scoring, editorial pipeline</text>
  <!-- bottom badges -->
  <g transform="translate(600,290)">
    <rect x="-205" y="0" width="130" height="30" rx="15" fill="white"/>
    <text x="-140" y="19.5" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#0a0f1e">▶  Next.js 15</text>
    <rect x="-65" y="0" width="130" height="30" rx="15" fill="rgba(255,255,255,0.10)" stroke="rgba(255,255,255,0.18)"/>
    <text x="0" y="19.5" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="white">◈  SQLite + WAL</text>
    <rect x="75" y="0" width="130" height="30" rx="15" fill="rgba(255,255,255,0.10)" stroke="rgba(255,255,255,0.18)"/>
    <text x="140" y="19.5" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="white">⬢  Node.js Hub</text>
  </g>
  <text x="600" y="355" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="500" letter-spacing="0.5" fill="rgba(255,255,255,0.45)">MIT · runs on a single Mac mini · authorized QA &amp; content-ops lab · not a bot farm for spam</text>
</svg>
