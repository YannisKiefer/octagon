<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Octagon - social card source (1200x630)</title>
  <style>
    @font-face {
      font-family: "DM Sans";
      src: url("assets/fonts/dmsans-400.woff2") format("woff2");
      font-weight: 400;
      font-style: normal;
      font-display: block;
    }
    @font-face {
      font-family: "DM Sans";
      src: url("assets/fonts/dmsans-500.woff2") format("woff2");
      font-weight: 500;
      font-style: normal;
      font-display: block;
    }
    @font-face {
      font-family: "DM Sans";
      src: url("assets/fonts/dmsans-700.woff2") format("woff2");
      font-weight: 700;
      font-style: normal;
      font-display: block;
    }

    /* Fixed 1200x630 canvas: rendered to assets/og.png by the
       orchestrator. No scroll, nothing clipped at any edge. */
    html, body {
      margin: 0;
      padding: 0;
      width: 1200px;
      height: 630px;
      overflow: hidden;
    }

    body {
      background: #F8F6F1;
      color: #0F1F17;
      font-family: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .frame {
      width: 1200px;
      height: 630px;
      padding: 52px 64px 56px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
    }

    .lockup {
      display: flex;
      align-items: center;
      gap: 16px;
      flex: none;
    }

    .lockup svg { width: 46px; height: 46px; display: block; }

    .wordmark {
      font-size: 31px;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .content {
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      gap: 56px;
      margin-top: 12px;
    }

    .copy { flex: 1 1 auto; min-width: 0; }

    .copy h1 {
      margin: 0;
      font-size: 60px;
      line-height: 1.08;
      font-weight: 700;
      letter-spacing: -0.022em;
      max-width: 9em;
    }

    .copy .sub {
      margin: 22px 0 0;
      font-size: 25px;
      font-weight: 500;
      color: #8F6234;
    }

    .rule {
      width: 68px;
      height: 4px;
      border-radius: 2px;
      background: #C58E5B;
      margin-top: 30px;
    }

    .shot { flex: 0 0 566px; }

    .shot-frame {
      background: #FFFFFF;
      border: 1px solid rgba(15, 31, 23, 0.18);
      border-radius: 18px;
      box-shadow: 0 34px 64px -34px rgba(15, 31, 23, 0.42), 0 10px 24px -14px rgba(15, 31, 23, 0.2);
      overflow: hidden;
    }

    .shot-frame img {
      display: block;
      width: 564px;
      height: 352.5px; /* 1440x900 contained exactly, nothing sliced */
    }
  </style>
</head>
<body>
  <div class="frame">
    <div class="lockup">
      <img src="assets/logo.png" alt="" width="46" height="46" style="display:block">
      <span class="wordmark">Octagon</span>
    </div>

    <div class="content">
      <div class="copy">
        <h1>Your iPhone fleet, on your Mac.</h1>
        <p class="sub">Local-first. Open source. MIT.</p>
        <div class="rule" aria-hidden="true"></div>
      </div>
      <div class="shot">
        <div class="shot-frame">
          <img src="assets/screenshots/dashboard-main.png" alt="Octagon dashboard: the device fleet as a chat" width="1440" height="900">
        </div>
      </div>
    </div>
  </div>
</body>
</html>
